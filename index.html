<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapsterra Loot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0b0b; color: white; font-family: sans-serif; text-align: center; margin: 0; height: 100vh; overflow: hidden; user-select: none; display: flex; flex-direction: column; align-items: center; }
        .stats-container { display: flex; justify-content: space-between; width: 92%; margin-top: 10px; gap: 10px; }
        .stat-box { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 10px; }
        .stat-lvl { font-size: 10px; color: #00ffcc; font-weight: bold; }
        .stat-val { font-size: 18px; font-weight: bold; color: #ffcc00; }
        .action-row { display: flex; justify-content: space-between; width: 92%; margin-top: 10px; gap: 10px; }
        .action-btn { flex: 1; background: #1a1a1a; color: #00ffcc; border: 1px solid #333; border-radius: 10px; padding: 12px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .balance-container { background: rgba(255, 255, 255, 0.05); border-radius: 50px; padding: 10px 20px; margin: 20px auto; display: flex; align-items: center; gap: 10px; border: 1px dashed #444; }
        .coin-wrap { flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 60px; }
        #tap-coin { width: 200px; height: 200px; background: radial-gradient(circle, #ffe066 0%, #ffcc00 50%, #b38f00 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(255, 204, 0, 0.3); border: 10px solid #cca300; cursor: pointer; transition: transform 0.05s; }
        #tap-coin:active { transform: scale(0.92); }
        #tap-coin::before { content: "T"; font-size: 80px; font-weight: bold; color: #b38f00; }
        .plus-one { position: absolute; color: white; font-size: 30px; font-weight: bold; pointer-events: none; animation: fly 0.6s forwards; z-index: 100; }
        @keyframes fly { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #000; padding: 12px 0; border-top: 1px solid #222; }
        .nav-item { flex: 1; font-size: 12px; color: #666; cursor: pointer; }
        .page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .page-card { background: #1a1a1a; padding: 15px; border-radius: 15px; border: 1px solid #333; margin-top: 15px; text-align: left; }
        .buy-now { background: #00ffcc; color: #000; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; outline: none; }
        .hist-item { background: #111; padding: 12px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #ffcc00; }
        .status-txt { font-weight: bold; font-size: 14px; }
        .note-pending { font-size: 10px; color: #aaa; margin-top: 5px; font-style: italic; }
        .note-success { font-size: 11px; color: #00ffcc; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div id="home-page" style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center;">
    <div class="stats-container">
        <div class="stat-box"><span class="stat-lvl">TAP LVL <span id="h-tl">1</span></span><div class="stat-val">+<span id="h-tv">1</span></div></div>
        <div class="stat-box"><span class="stat-lvl" style="color:#ffcc00">ENERGY LVL <span id="h-el">1</span></span><div class="stat-val"><span id="ce">100</span>/<span id="me">100</span></div></div>
    </div>
    <div class="action-row">
        <div class="action-btn" onclick="openP('p-tap')">🚀 UPGRADE TAP</div>
        <div class="action-btn" style="color:#ffcc00" onclick="openP('p-eng')">⚡ UPGRADE ENERGY</div>
    </div>
    <div class="balance-container">
        <span style="font-size:24px;">🟡 <span id="sc">0</span></span>
        <span style="color:#00ffcc; border-left:1px solid #444; padding-left:10px;">₹<span id="rs">0.00</span></span>
    </div>
    <div class="coin-wrap"><div id="tap-coin"></div></div>
    <div class="bottom-nav">
        <div class="nav-item" style="color:#ffcc00" onclick="closeP()">🏠 Home</div>
        <div class="nav-item" onclick="openP('p-wd')">💰 Withdraw</div>
    </div>
</div>

<div id="p-tap" class="page">
    <h2>Upgrade Tap Power</h2>
    <div class="page-card"><p>Level: <span id="pt-lvl">1</span></p><h3 id="pt-cost">Cost: 100</h3><button class="buy-now" onclick="up('tap')">BUY UPGRADE</button></div>
    <button onclick="closeP()" style="margin-top:20px; color:gray; background:none; border:none;">← Back</button>
</div>

<div id="p-eng" class="page">
    <h2>Upgrade Energy</h2>
    <div class="page-card"><p>Level: <span id="pe-lvl">1</span></p><h3 id="pe-cost">Cost: 100</h3><button class="buy-now" style="background:#ffcc00" onclick="up('eng')">BUY UPGRADE</button></div>
    <button onclick="closeP()" style="margin-top:20px; color:gray; background:none; border:none;">← Back</button>
</div>

<div id="p-wd" class="page">
    <h2 style="color:#00ffcc">Withdrawal</h2>
    <input type="text" id="upi" placeholder="Enter UPI ID (name@apl)">
    <div class="page-card">
        <h4 style="margin:0">1. Progressive</h4>
        <button class="buy-now" onclick="wd('prog')">Withdraw ₹<span id="prog-v">1</span></button>
    </div>
    <div class="page-card">
        <h4 style="margin:0">2. Always High</h4>
        <button class="buy-now" style="background:#ffcc00" onclick="wd('always')">Withdraw ₹<span id="alw-v">10</span></button>
    </div>
    <div style="text-align:left; margin-top:20px; padding-bottom:100px;">
        <h4 style="border-bottom:1px solid #333; padding-bottom:5px;">Withdrawal History</h4>
        <div id="hist-list"></div>
    </div>
    <button onclick="closeP()" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); color:gray; background:#000; padding:10px 30px; border-radius:10px; border:1px solid #333;">← Back</button>
</div>

<script>
    let tg = window.Telegram.WebApp; tg.expand();
    let s = parseInt(localStorage.getItem('s'))||0, tl = parseInt(localStorage.getItem('tl'))||1, el = parseInt(localStorage.getItem('el'))||1, wl = parseInt(localStorage.getItem('wl'))||1;
    let hi = JSON.parse(localStorage.getItem('hi'))||[];
    let me = el*100, ce = parseInt(localStorage.getItem('ce'))||me;

    function upd() {
        document.getElementById('sc').innerText = s; document.getElementById('rs').innerText = (s/100).toFixed(2);
        document.getElementById('h-tl').innerText = tl; document.getElementById('h-tv').innerText = tl;
        document.getElementById('h-el').innerText = el; document.getElementById('ce').innerText = ce; document.getElementById('me').innerText = me;
        document.getElementById('pt-lvl').innerText = tl; document.getElementById('pt-cost').innerText = "Cost: "+(tl*100);
        document.getElementById('pe-lvl').innerText = el; document.getElementById('pe-cost').innerText = "Cost: "+(el*100);
        document.getElementById('prog-v').innerText = wl; document.getElementById('alw-v').innerText = wl+9;
        
        let hl = document.getElementById('hist-list');
        hl.innerHTML = hi.length ? hi.map(item => `
            <div class="hist-item">
                <div style="display:flex; justify-content:space-between;">
                    <b>₹${item.amt}</b>
                    <span class="status-txt" style="color:${item.status==='SUCCESS'?'#00ffcc':'#ffcc00'}">${item.status}</span>
                </div>
                ${item.status === 'PENDING' ? 
                    `<div class="note-pending">Tension na lo, 20 mint se 2 mnt ke beech payment ho jayega.</div>` : 
                    `<div class="note-success">Congratulation! First payment mil gaya ab tap ko aur energy upgrade karo.</div>`
                }
                <small style="color:#555; font-size:9px;">${item.date}</small>
            </div>
        `).join('') : '<small style="color:#444">No history yet</small>';

        localStorage.setItem('s',s); localStorage.setItem('tl',tl); localStorage.setItem('el',el); localStorage.setItem('ce',ce); localStorage.setItem('wl',wl); localStorage.setItem('hi', JSON.stringify(hi));
    }

    document.getElementById('tap-coin').onclick = (e) => {
        if(ce > 0) {
            s += tl; ce--;
            let p = document.createElement('div'); p.className='plus-one'; p.innerText="+"+tl;
            p.style.left=e.clientX+'px'; p.style.top=e.clientY+'px';
            document.body.appendChild(p); setTimeout(()=>p.remove(),600); upd();
        } else { tg.showAlert("No Energy!"); }
    };

    function up(t) {
        let c = (t==='tap'?tl:el)*100;
        if(s >= c) { s-=c; if(t==='tap') tl++; else {el++; me=el*100; ce=me;} upd(); tg.showAlert("Upgrade Successful!"); }
        else tg.showAlert("Low coins!");
    }

    function wd(t) {
        let u = document.getElementById('upi').value; if(!u.includes('@')) return tg.showAlert("UPI ID sahi dalo!");
        let v = (t==='prog')?wl:(wl+9);
        if(s >= v*100) { 
            s-=v*100; if(t==='prog') wl++; 
            hi.unshift({amt: v, status: 'PENDING', date: new Date().toLocaleString()});
            upd(); tg.showAlert("Request Sent!"); 
            // Demo for testing success after 5 seconds (aap ise admin se control karenge real me)
            /* setTimeout(() => { hi[0].status = 'SUCCESS'; upd(); }, 5000); */
        } else tg.showAlert("Low coins!");
    }

    function openP(id) { document.querySelectorAll('.page').forEach(p=>p.style.display='none'); document.getElementById(id).style.display='block'; }
    function closeP() { document.querySelectorAll('.page').forEach(p=>p.style.display='none'); }
    setInterval(() => { if(ce < me) { ce++; upd(); } }, 2000); upd();
</script>
</body>
</html>
