<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Fast Pro - Wallet & Timer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0b0b; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; user-select: none; }
        .header { padding: 10px; font-size: 1.2rem; color: #00ffcc; font-weight: bold; background: #1a1a1a; margin-bottom: 10px; }
        
        /* Wallet Box */
        .wallet-card { background: linear-gradient(135deg, #1a1a1a, #2c2c2c); margin: 10px 20px; padding: 15px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .balance-label { font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
        .rupee-val { font-size: 1.8rem; color: #00ffcc; font-weight: bold; }
        
        .score-box { font-size: 2.5rem; margin: 10px; color: #fff; text-shadow: 0 0 10px #ff00ff; }
        
        /* Coin & Animation */
        .coin-container { position: relative; display: inline-block; margin-top: 10px; }
        #main-coin { width: 160px; cursor: pointer; transition: 0.1s; filter: drop-shadow(0 0 15px #00ffcc); -webkit-tap-highlight-color: transparent; }
        #main-coin:active { transform: scale(0.95); }
        .plus-one { position: absolute; color: #00ffcc; font-size: 24px; font-weight: bold; pointer-events: none; animation: flyUp 0.8s ease-out forwards; z-index: 100; }
        @keyframes flyUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }

        /* Buttons */
        .btn { display: none; margin: 15px auto; padding: 15px; border-radius: 12px; border: none; font-weight: bold; width: 85%; cursor: pointer; font-size: 1rem; }
        #earn-more-btn { background: linear-gradient(45deg, #00b09b, #96c93d); color: white; }
        #cooldown-btn { background: #333; color: #888; cursor: not-allowed; }
        #nav-withdraw { background: #444; color: white; display: block; margin-top: 20px; width: 50%; padding: 10px; }

        /* Withdraw Page */
        #withdraw-page { display: none; padding: 20px; }
        .back-btn { background: #ff5858; color: white; padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; margin-top: 30px; }

        /* Loader */
        #ad-loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 5px solid #333; border-top: 5px solid #00ffcc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="ad-loader">
        <div class="spinner"></div>
        <p id="loader-text" style="color:#00ffcc; margin-top:20px;">Verifying Ad... 10s</p>
    </div>

    <div id="game-page">
        <div class="header">TAP FAST PRO ⚡</div>
        
        <div class="wallet-card">
            <div class="balance-label">Your Earnings</div>
            <div class="rupee-val">₹<span id="rupee-amt">0.00</span></div>
            <div style="font-size: 0.7rem; color: #666; margin-top: 5px;">(400 Coins = ₹1)</div>
        </div>

        <div class="score-box"><span id="score">0</span> <small style="font-size: 1rem;">Coins</small></div>
        <div style="color:#ff00ff; margin-bottom: 5px;">Taps: <span id="taps-left">10</span>/10</div>

        <div class="coin-container" id="coin-wrapper">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968330.png" id="main-coin">
        </div>

        <button id="earn-more-btn" class="btn" onclick="handleAdClick()">💰 Earn +10 Points</button>
        <button id="cooldown-btn" class="btn">Ads Lock: <span id="timer">60:00</span></button>
        
        <button id="nav-withdraw" class="btn" onclick="showWithdraw()">Wallet/Withdraw</button>
    </div>

    <div id="withdraw-page">
        <div class="header">WALLET</div>
        <div class="wallet-card">
            <div class="balance-label">Available to Withdraw</div>
            <div class="rupee-val">₹<span id="withdraw-rs">0.00</span></div>
        </div>
        <p style="color: #888; font-size: 0.9rem;">Minimum Payout: ₹50</p>
        <div style="text-align: left; padding: 20px; color: #aaa; font-size: 0.8rem;">
            1. Points clear mat karna.<br>
            2. Fake clicks se bacho.<br>
            3. Payment har Sunday milta hai.
        </div>
        <button class="back-btn" onclick="showHome()">← Back to Home</button>
    </div>

    <script>
        let tele = window.Telegram.WebApp;
        tele.expand();

        const myAdLink = "https://www.effectivegatecpm.com/h2k3bt3ugx?key=61b8801b9434839364f72a682179f2d0"; 

        // Data Storage
        let score = parseInt(localStorage.getItem('user_score')) || 0;
        let tapsLeft = localStorage.getItem('user_taps') !== null ? parseInt(localStorage.getItem('user_taps')) : 10;
        let adsViewed = parseInt(localStorage.getItem('ads_viewed')) || 0;
        let cooldownTime = localStorage.getItem('cooldown_time') || null;

        const rupeeAmt = document.getElementById('rupee-amt');
        const withdrawRs = document.getElementById('withdraw-rs');
        const scoreDisplay = document.getElementById('score');
        const tapsDisplay = document.getElementById('taps-left');
        const mainCoin = document.getElementById('main-coin');
        const earnBtn = document.getElementById('earn-more-btn');
        const cooldownBtn = document.getElementById('cooldown-btn');
        const timerDisplay = document.getElementById('timer');

        function updateUI() {
            scoreDisplay.innerText = score;
            tapsDisplay.innerText = tapsLeft;
            
            // Convert to Rupees (400 = 1)
            let money = (score / 400).toFixed(2);
            rupeeAmt.innerText = money;
            withdrawRs.innerText = money;

            localStorage.setItem('user_score', score);
            localStorage.setItem('user_taps', tapsLeft);
            localStorage.setItem('ads_viewed', adsViewed);

            if (tapsLeft > 0) {
                mainCoin.style.display = 'inline-block';
                earnBtn.style.display = 'none';
                cooldownBtn.style.display = 'none';
            } else {
                mainCoin.style.display = 'none';
                checkCooldown();
            }
        }

        function checkCooldown() {
            const now = new Date().getTime();
            if (cooldownTime && now < cooldownTime) {
                earnBtn.style.display = 'none';
                cooldownBtn.style.display = 'block';
                runTimer(cooldownTime);
            } else {
                if (adsViewed >= 3) {
                    adsViewed = 0;
                    cooldownTime = null;
                    localStorage.removeItem('cooldown_time');
                    localStorage.setItem('ads_viewed', 0);
                }
                cooldownBtn.style.display = 'none';
                earnBtn.style.display = 'block';
            }
        }

        function runTimer(endTime) {
            const tInt = setInterval(() => {
                const now = new Date().getTime();
                const diff = endTime - now;
                if (diff <= 0) {
                    clearInterval(tInt);
                    updateUI();
                } else {
                    let mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    let secs = Math.floor((diff % (1000 * 60)) / 1000);
                    timerDisplay.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
            }, 1000);
        }

        mainCoin.addEventListener('click', (e) => {
            if (tapsLeft > 0) {
                score++; tapsLeft--;
                const p1 = document.createElement('div');
                p1.innerText = '+1'; p1.className = 'plus-one';
                p1.style.left = (e.clientX - document.getElementById('coin-wrapper').offsetLeft - 10) + 'px';
                p1.style.top = (e.clientY - document.getElementById('coin-wrapper').offsetTop - 20) + 'px';
                document.getElementById('coin-wrapper').appendChild(p1);
                setTimeout(() => p1.remove(), 800);
                updateUI();
            }
        });

        function handleAdClick() {
            window.open(myAdLink, '_blank');
            setTimeout(() => {
                alert("Click OK to Verify Ad Points.");
                const ldr = document.getElementById('ad-loader');
                ldr.style.display = 'flex';
                let v = 10;
                const vInt = setInterval(() => {
                    v--;
                    document.getElementById('loader-text').innerText = `Verifying Ad... ${v}s`;
                    if (v <= 0) {
                        clearInterval(vInt);
                        ldr.style.display = 'none';
                        score += 10; tapsLeft = 10; adsViewed++;
                        if (adsViewed >= 3) {
                            cooldownTime = new Date().getTime() + (60 * 60 * 1000);
                            localStorage.setItem('cooldown_time', cooldownTime);
                        }
                        updateUI();
                        alert("Success! Points added.");
                    }
                }, 1000);
            }, 5000);
        }

        function showWithdraw() {
            document.getElementById('game-page').style.display = 'none';
            document.getElementById('withdraw-page').style.display = 'block';
        }

        function showHome() {
            document.getElementById('withdraw-page').style.display = 'none';
            document.getElementById('game-page').style.display = 'block';
        }

        updateUI();
    </script>
</body>
</html>
