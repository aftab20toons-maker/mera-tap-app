<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapsterra Hourly Loot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0b0b; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; user-select: none; display: flex; flex-direction: column; align-items: center; }
        
        /* Stats Row */
        .stats-container { display: flex; justify-content: space-between; width: 90%; padding: 15px 0; gap: 10px; }
        .stat-box { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 12px; flex: 1; }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
        .stat-val { font-size: 18px; font-weight: bold; color: #ffcc00; margin-top: 5px; }

        /* Upgrade Buttons */
        .upgrade-wrapper { display: flex; justify-content: space-between; width: 90%; gap: 10px; margin-bottom: 10px; }
        .main-up-btn { background: #1a1a1a; color: #00ffcc; border: 1px solid #333; border-radius: 8px; padding: 10px; flex: 1; cursor: pointer; font-size: 10px; font-weight: bold; text-transform: uppercase; }

        /* Wallet Section */
        .wallet-container { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px dashed #444; 
            border-radius: 50px; 
            display: inline-flex; 
            align-items: center; 
            padding: 10px 25px; 
            margin: 15px auto; 
        }
        .wallet-info { text-align: center; margin-left: 10px; }
        .wallet-label { font-size: 10px; color: #aaa; display: block; }
        .wallet-coins { font-size: 26px; font-weight: bold; color: white; }
        .wallet-rs { font-size: 14px; color: #00ffcc; font-weight: bold; margin-left: 10px; }

        /* 3D COIN CSS */
        .coin-wrapper { margin-top: 40px; display: flex; justify-content: center; width: 100%; position: relative; perspective: 1000px; }
        
        #main-tap-coin {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ffe066 0%, #ffcc00 50%, #b38f00 100%);
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.6), inset 0 0 20px rgba(255,255,255,0.5);
            border: 8px solid #cca300;
            transition: transform 0.1s;
        }

        #main-tap-coin::before {
            content: "C"; 
            font-size: 80px;
            font-weight: bold;
            color: #b38f00;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.3);
        }

        #main-tap-coin:active { transform: scale(0.92) rotateX(10deg); }
        
        /* --- WHITE +1 ANIMATION --- */
        .plus-one { 
            position: absolute; 
            color: #ffffff; /* Yellow se White kar diya */
            font-size: 35px; 
            font-weight: bold; 
            pointer-events: none; 
            animation: flyUp 0.8s ease-out forwards; 
            z-index: 100;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        @keyframes flyUp { 
            0% { opacity: 1; transform: translateY(0); } 
            100% { opacity: 0; transform: translateY(-160px); } 
        }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #000; padding: 15px 0; border-top: 1px solid #222; }
        .nav-item { flex: 1; font-size: 10px; color: #666; cursor: pointer; }
        .nav-item.active { color: #ffcc00; }

        /* Sub Pages */
        .sub-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 1000; padding-top: 50px; }
        .back-home { background: #ffcc00; color: black; border: none; padding: 12px 25px; border-radius: 10px; margin-top: 30px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="home-page" style="width: 100%;">
        <div class="stats-container" style="margin: 0 auto;">
            <div class="stat-box">
                <div class="stat-label">Earn per tap</div>
                <div class="stat-val">+1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Energy</div>
                <div class="stat-val"><span id="energy-val">10</span>/10</div>
            </div>
        </div>

        <div class="upgrade-wrapper" style="margin: 0 auto;">
            <button class="main-up-btn" onclick="openPage('upgrade-tap-page')">🚀 UPGRADE TAP</button>
            <button class="main-up-btn" onclick="openPage('upgrade-energy-page')" style="color: #ffcc00;">⚡ UPGRADE ENERGY</button>
        </div>

        <div class="wallet-container">
            <div style="width:25px; height:25px; background:#ffcc00; border-radius:50%; border:2px solid #b38f00;"></div>
            <div class="wallet-info">
                <span class="wallet-label">YOUR EARNING</span>
                <span class="wallet-coins" id="total-coins">0</span>
                <span class="wallet-rs">≈ ₹<span id="total-rs">0.00</span></span>
            </div>
        </div>

        <div class="coin-wrapper">
            <div id="main-tap-coin"></div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="closeAllPages()">🏠<br>Home</div>
            <div class="nav-item" onclick="openPage('task-page')">⛏️<br>More Task</div>
            <div class="nav-item" onclick="openPage('friends-page')">👥<br>Friends</div>
            <div class="nav-item" onclick="openPage('earn-page')">💰<br>Earn</div>
        </div>
    </div>

    <div id="upgrade-tap-page" class="sub-page"><h2>Tap Upgrade</h2><button class="back-home" onclick="closeAllPages()">Back Home</button></div>
    <div id="upgrade-energy-page" class="sub-page"><h2>Energy Upgrade</h2><button class="back-home" onclick="closeAllPages()">Back Home</button></div>
    <div id="task-page" class="sub-page"><h2>More Task</h2><button class="back-home" onclick="closeAllPages()">Back Home</button></div>
    <div id="friends-page" class="sub-page"><h2>Friends</h2><button class="back-home" onclick="closeAllPages()">Back Home</button></div>
    <div id="earn-page" class="sub-page"><h2>Earn More</h2><button class="back-home" onclick="closeAllPages()">Back Home</button></div>

    <script>
        let tele = window.Telegram.WebApp;
        tele.expand();

        let score = parseInt(localStorage.getItem('tap_score')) || 0;
        let energy = parseInt(localStorage.getItem('tap_energy')) || 10;

        function updateUI() {
            document.getElementById('total-coins').innerText = score;
            document.getElementById('energy-val').innerText = energy;
            document.getElementById('total-rs').innerText = (score / 100).toFixed(2);
            localStorage.setItem('tap_score', score);
            localStorage.setItem('tap_energy', energy);
        }

        document.getElementById('main-tap-coin').addEventListener('click', (e) => {
            if (energy > 0) {
                score++; energy--;
                
                // White +1 Animation
                const p1 = document.createElement('div');
                p1.innerText = '+1'; p1.className = 'plus-one';
                p1.style.left = (e.clientX - 20) + 'px';
                p1.style.top = (e.clientY - 40) + 'px';
                document.body.appendChild(p1);
                setTimeout(() => p1.remove(), 800);
                
                updateUI();
            } else {
                tele.showAlert("Out of Energy!");
            }
        });

        function openPage(id) {
            closeAllPages();
            document.getElementById(id).style.display = 'block';
        }

        function closeAllPages() {
            const pages = document.querySelectorAll('.sub-page');
            pages.forEach(p => p.style.display = 'none');
        }

        updateUI();
    </script>
</body>
</html>
