<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapsterra Hourly Loot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0b0b; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; user-select: none; display: flex; flex-direction: column; align-items: center; }
        
        /* Stats Container */
        .stats-container { display: flex; justify-content: space-between; width: 90%; padding: 15px 0; gap: 10px; margin-top: 10px; }
        .stat-box { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 12px; flex: 1; }
        .stat-lvl { font-size: 10px; color: #00ffcc; font-weight: bold; display: block; margin-bottom: 4px; }
        .stat-label { font-size: 9px; color: #888; text-transform: uppercase; }
        .stat-val { font-size: 16px; font-weight: bold; color: #ffcc00; }

        /* Upgrade Buttons */
        .upgrade-wrapper { display: flex; justify-content: space-between; width: 90%; gap: 10px; margin-bottom: 15px; }
        .main-up-btn { background: #1a1a1a; color: #00ffcc; border: 1px solid #333; border-radius: 8px; padding: 12px; flex: 1; cursor: pointer; font-size: 10px; font-weight: bold; text-transform: uppercase; }

        /* Wallet with Rs Value */
        .wallet-container { background: rgba(255, 255, 255, 0.03); border: 1px dashed #444; border-radius: 50px; display: flex; flex-direction: column; align-items: center; padding: 10px 30px; margin: 5px auto; }
        .wallet-main { display: flex; align-items: center; }
        .wallet-coins { font-size: 28px; font-weight: bold; color: white; margin-left: 10px; }
        .wallet-value { font-size: 14px; color: #00ffcc; font-weight: bold; margin-top: 2px; }

        /* Centered 3D Coin */
        .coin-wrapper { flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 80px; }
        #main-tap-coin { width: 220px; height: 220px; background: radial-gradient(circle, #ffe066 0%, #ffcc00 50%, #b38f00 100%); border-radius: 50%; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 50px rgba(255, 204, 0, 0.5), inset 0 0 20px rgba(255,255,255,0.4); border: 10px solid #cca300; transition: transform 0.1s; }
        #main-tap-coin:active { transform: scale(0.92); }
        #main-tap-coin::before { content: "T"; font-size: 100px; font-weight: bold; color: #b38f00; }
        
        .plus-one { position: absolute; color: white; font-size: 35px; font-weight: bold; pointer-events: none; animation: fly 0.8s ease-out forwards; z-index: 100; }
        @keyframes fly { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-150px); } }

        .sub-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .upgrade-card { background: #1a1a1a; border: 1px solid #333; border-radius: 15px; padding: 20px; margin-top: 15px; }
        .buy-btn { background: #00ffcc; color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .back-home { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 8px; margin-top: 20px; cursor: pointer; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #000; padding: 15px 0; border-top: 1px solid #222; }
        .nav-item { flex: 1; font-size: 12px; color: #666; cursor: pointer; }
        .nav-item.active { color: #ffcc00; }
    </style>
</head>
<body>

    <div id="home-page" style="width:100%; height:100vh; display:flex; flex-direction:column;">
        <div class="stats-container" style="margin: 10px auto;">
            <div class="stat-box">
                <span class="stat-lvl">LVL <span id="home-tap-lvl">1</span></span>
                <div class="stat-label">Earn per tap</div>
                <div class="stat-val">+<span id="tap-power-val">1</span></div>
            </div>
            <div class="stat-box">
                <span class="stat-lvl" style="color:#ffcc00">LVL <span id="home-energy-lvl">1</span></span>
                <div class="stat-label">Energy</div>
                <div class="stat-val"><span id="current-energy">10</span>/<span id="max-energy">10</span></div>
            </div>
        </div>

        <div class="upgrade-wrapper" style="margin: 0 auto; width: 90%;">
            <button class="main-up-btn" onclick="openPage('upgrade-tap-page')">🚀 Upgrade Tap</button>
            <button class="main-up-btn" onclick="openPage('upgrade-energy-page')" style="color:#ffcc00">⚡ Upgrade Energy</button>
        </div>

        <div class="wallet-container">
            <div class="wallet-main">
                <div style="width:20px; height:20px; background:#ffcc00; border-radius:50%; border:2px solid #b38f00;"></div>
                <span class="wallet-coins" id="total-coins">0</span>
            </div>
            <div class="wallet-value">≈ ₹<span id="rs-value">0.00</span></div>
        </div>

        <div class="coin-wrapper">
            <div id="main-tap-coin"></div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="closeAllPages()">🏠 Home</div>
            <div class="nav-item" onclick="openPage('withdraw-page')">💰 Withdraw</div>
        </div>
    </div>

    <div id="upgrade-tap-page" class="sub-page">
        <h2 style="color:#00ffcc">Tap Power Upgrade</h2>
        <div class="upgrade-card">
            <p>Abhi ka Level: <span id="tap-lvl-display">1</span></p>
            <h3 id="tap-cost-display">200 Coins</h3>
            <button class="buy-btn" onclick="buyTapUpgrade()">UPGRADE KARO</button>
        </div>
        <button class="back-home" onclick="closeAllPages()">Piche Jao</button>
    </div>

    <div id="upgrade-energy-page" class="sub-page">
        <h2 style="color:#ffcc00">Energy Upgrade</h2>
        <div class="upgrade-card">
            <p>Abhi ka Level: <span id="energy-lvl-display">1</span></p>
            <h3 id="energy-cost-display">100 Coins</h3>
            <button class="buy-btn" onclick="buyEnergyUpgrade()">UPGRADE KARO</button>
        </div>
        <button class="back-home" onclick="closeAllPages()">Piche Jao</button>
    </div>

    <div id="withdraw-page" class="sub-page">
        <h2 style="color:#00ffcc">Paise Nikalein</h2>
        <div id="upi-step-1">
            <div class="upgrade-card" onclick="showWithdrawOptions()" style="cursor:pointer">
                <strong>📱 UPI Se Nikalein</strong>
                <p style="font-size: 12px; color:#888">GPay, PhonePe, Paytm</p>
            </div>
        </div>
        <div id="upi-step-2" style="display:none">
            <div class="upgrade-card">
                <h3 id="dyn-title">₹1 Nikalein</h3>
                <button class="buy-btn" onclick="withdraw('dynamic')">Abhi Nikalein</button>
            </div>
            <div class="upgrade-card" style="border-color:#ffcc00">
                <h3>₹10 Nikalein (Hamesha)</h3>
                <button class="buy-btn" style="background:#ffcc00" onclick="withdraw('fixed')">Abhi Nikalein</button>
            </div>
            <button class="back-home" onclick="resetWithdraw()">← Piche Jao</button>
        </div>
        <button class="back-home" style="background:#222" onclick="closeAllPages()">Band Karo</button>
    </div>

    <script>
        let tele = window.Telegram.WebApp;
        tele.expand();

        let score = parseInt(localStorage.getItem('tap_score')) || 0;
        let tapPower = parseInt(localStorage.getItem('tap_power')) || 1;
        let energyLvl = parseInt(localStorage.getItem('energy_lvl')) || 1;
        let withdrawCount = parseInt(localStorage.getItem('withdraw_count')) || 0;
        
        let maxEnergy = energyLvl * 10;
        let currentEnergy = parseInt(localStorage.getItem('current_energy')) || maxEnergy;

        function updateUI() {
            document.getElementById('total-coins').innerText = score;
            document.getElementById('rs-value').innerText = (score / 100).toFixed(2);
            document.getElementById('tap-power-val').innerText = tapPower;
            document.getElementById('home-tap-lvl').innerText = tapPower;
            document.getElementById('tap-lvl-display').innerText = tapPower;
            
            document.getElementById('home-energy-lvl').innerText = energyLvl;
            document.getElementById('energy-lvl-display').innerText = energyLvl;
            document.getElementById('current-energy').innerText = currentEnergy;
            document.getElementById('max-energy').innerText = maxEnergy;

            document.getElementById('tap-cost-display').innerText = (100 * Math.pow(2, tapPower)) + " Coins Ki Jarurat Hai";
            document.getElementById('energy-cost-display').innerText = (50 * Math.pow(2, energyLvl)) + " Coins Ki Jarurat Hai";
            
            let currentDynAmt = withdrawCount + 1;
            document.getElementById('dyn-title').innerText = `₹${currentDynAmt} Nikalein`;

            localStorage.setItem('tap_score', score);
            localStorage.setItem('tap_power', tapPower);
            localStorage.setItem('energy_lvl', energyLvl);
            localStorage.setItem('withdraw_count', withdrawCount);
            localStorage.setItem('current_energy', currentEnergy);
        }

        document.getElementById('main-tap-coin').addEventListener('click', (e) => {
            if(currentEnergy > 0) {
                score += tapPower;
                currentEnergy--;
                let p = document.createElement('div');
                p.innerText = "+" + tapPower; p.className = 'plus-one';
                p.style.left = e.clientX + 'px'; p.style.top = e.clientY + 'px';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 800);
                updateUI();
            } else { tele.showAlert("Bhai energy khatam ho gayi hai! Thoda intezar karo."); }
        });

        setInterval(() => { if(currentEnergy < maxEnergy) { currentEnergy++; updateUI(); } }, 1000);

        function buyTapUpgrade() {
            let cost = 100 * Math.pow(2, tapPower);
            if(score >= cost) { score -= cost; tapPower++; updateUI(); tele.showAlert("Mubarak ho! Tap Power badh gayi."); }
            else { tele.showAlert(`Bhai, abhi ${cost} coins ki jarurat hai!`); }
        }

        function buyEnergyUpgrade() {
            let cost = 50 * Math.pow(2, energyLvl);
            if(score >= cost) { score -= cost; energyLvl++; maxEnergy = energyLvl * 10; currentEnergy = maxEnergy; updateUI(); tele.showAlert("Mubarak ho! Energy badh gayi."); }
            else { tele.showAlert(`Bhai, abhi ${cost} coins ki jarurat hai!`); }
        }

        function showWithdrawOptions() { document.getElementById('upi-step-1').style.display='none'; document.getElementById('upi-step-2').style.display='block'; }
        function resetWithdraw() { document.getElementById('upi-step-1').style.display='block'; document.getElementById('upi-step-2').style.display='none'; }
        
        function withdraw(type) {
            let amt = (type === 'dynamic') ? (withdrawCount + 1) : 10;
            let cost = amt * 100;
            if(score >= cost) {
                score -= cost;
                if(type === 'dynamic') withdrawCount++;
                updateUI();
                tele.showAlert(`Bhai ₹${amt} ka withdraw safal raha!`);
            } else { tele.showAlert(`Kam se kam ${cost} coins ki jarurat hai bhai!`); }
        }

        function openPage(id) { document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none'); document.getElementById(id).style.display = 'block'; }
        function closeAllPages() { document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none'); document.getElementById('home-page').style.display = 'flex'; resetWithdraw(); }

        updateUI();
    </script>
</body>
</html>
