<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Fast - Secure Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0b0b; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; user-select: none; }
        .header { padding: 15px; font-size: 1.3rem; color: #00ffcc; font-weight: bold; text-shadow: 0 0 10px #00ffcc; }
        .score-box { font-size: 3.5rem; margin: 10px; color: #fff; text-shadow: 0 0 15px #ff00ff; }
        #main-coin { width: 180px; cursor: pointer; transition: 0.1s; filter: drop-shadow(0 0 15px #00ffcc); -webkit-tap-highlight-color: transparent; }
        #main-coin:active { transform: scale(0.9); }
        
        .btn { display: none; margin: 15px auto; padding: 15px; border-radius: 12px; border: none; font-weight: bold; width: 85%; cursor: pointer; font-size: 1.1rem; }
        #earn-more-btn { background: linear-gradient(45deg, #00b09b, #96c93d); color: white; display: block; }
        #withdraw-btn { background: linear-gradient(45deg, #f857a6, #ff5858); color: white; }
        
        /* Verification Loader Overlay */
        #ad-loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 5px solid #333; border-top: 5px solid #00ffcc; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-msg { color: #00ffcc; font-weight: bold; margin-top: 20px; font-size: 1.2rem; }
        .warning { color: #ff5858; font-size: 0.8rem; margin-top: 10px; padding: 0 20px; }
    </style>
</head>
<body>

    <div id="ad-loader">
        <div class="spinner"></div>
        <p class="loader-msg" id="loader-text">Checking Ad View... 10s</p>
        <p class="warning">Please wait! Our system is verifying your reward...</p>
    </div>

    <div id="game-page">
        <div class="header">TAP FAST ⚡</div>
        <div style="color:#aaa;">User: <span id="user-name">Guest</span></div>
        <div class="score-box"><span id="score">0</span></div>
        <div style="color:#ff00ff; margin-bottom: 10px;">Taps Left: <span id="taps-left">10</span>/10</div>

        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968330.png" id="main-coin">

        <button id="earn-more-btn" class="btn" onclick="startAdProcess()">💰 Get +10 Points & Recharge</button>
        <button id="withdraw-btn" class="btn" onclick="alert('Min. Withdraw: 5000 Pts')">Withdraw Points</button>
    </div>

    <script>
        let tele = window.Telegram.WebApp;
        tele.expand();
        document.getElementById('user-name').innerText = tele.initDataUnsafe.user?.first_name || "Guest";

        // TERA ADSTERRA SMARTLINK
        const myAdLink = "https://www.effectivegatecpm.com/h2k3bt3ugx?key=61b8801b9434839364f72a682179f2d0"; 

        // Local Storage
        let score = parseInt(localStorage.getItem('user_score')) || 0;
        let tapsLeft = localStorage.getItem('user_taps') !== null ? parseInt(localStorage.getItem('user_taps')) : 10;

        const scoreDisplay = document.getElementById('score');
        const tapsDisplay = document.getElementById('taps-left');
        const mainCoin = document.getElementById('main-coin');

        function updateUI() {
            scoreDisplay.innerText = score;
            tapsDisplay.innerText = tapsLeft;
            localStorage.setItem('user_score', score);
            localStorage.setItem('user_taps', tapsLeft);

            if (tapsLeft === 0) {
                mainCoin.style.display = 'none';
                document.getElementById('earn-more-btn').style.display = 'block';
            } else {
                mainCoin.style.display = 'inline-block';
                document.getElementById('earn-more-btn').style.display = 'none';
            }
        }

        mainCoin.addEventListener('click', () => {
            if (tapsLeft > 0) {
                score++;
                tapsLeft--;
                updateUI();
            }
        });

        function startAdProcess() {
            // Step 1: Ad Open Karo
            window.open(myAdLink, '_blank');

            // Step 2: 5 second baad Notification do ki "Wapas aao"
            setTimeout(() => {
                alert("Ads viewed! Ab wapas bot par aao verification ke liye.");
                startVerification(); // Verification timer shuru
            }, 5000);
        }

        function startVerification() {
            const loader = document.getElementById('ad-loader');
            loader.style.display = 'flex';
            
            let timeLeft = 10; // 10 Second Ka Verification
            const timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('loader-text').innerText = `Checking Ad View... ${timeLeft}s`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    loader.style.display = 'none';
                    
                    // Reward Update
                    score += 10;
                    tapsLeft = 10; 
                    updateUI();
                    
                    alert("✅ Verification Successful! +10 Points added.");
                    document.getElementById('loader-text').innerText = `Checking Ad View... 10s`;
                }
            }, 1000);
        }

        updateUI();
    </script>
</body>
</html>
