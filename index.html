<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapsterra Hourly Loot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0b0b; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; user-select: none; display: flex; flex-direction: column; align-items: center; }
        
        /* Stats Row */
        .stats-container { display: flex; justify-content: space-between; width: 90%; padding: 15px 0; gap: 10px; }
        .stat-box { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 12px; flex: 1; }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
        .stat-val { font-size: 18px; font-weight: bold; color: #ffcc00; margin-top: 5px; }

        /* Upgrade Buttons Home */
        .upgrade-wrapper { display: flex; justify-content: space-between; width: 90%; gap: 10px; margin-bottom: 10px; }
        .main-up-btn { background: #1a1a1a; color: #00ffcc; border: 1px solid #333; border-radius: 8px; padding: 10px; flex: 1; cursor: pointer; font-size: 10px; font-weight: bold; text-transform: uppercase; }

        /* Wallet Section */
        .wallet-container { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px dashed #444; 
            border-radius: 50px; 
            display: inline-flex; 
            align-items: center; 
            padding: 10px 25px; 
            margin: 15px auto; 
        }
        .wallet-info { text-align: center; margin-left: 10px; }
        .wallet-label { font-size: 10px; color: #aaa; display: block; }
        .wallet-coins { font-size: 26px; font-weight: bold; color: white; }
        .wallet-rs { font-size: 14px; color: #00ffcc; font-weight: bold; margin-left: 10px; }

        /* 3D COIN */
        .coin-wrapper { margin-top: 40px; display: flex; justify-content: center; width: 100%; position: relative; perspective: 1000px; }
        #main-tap-coin {
            width: 200px; height: 200px;
            background: radial-gradient(circle, #ffe066 0%, #ffcc00 50%, #b38f00 100%);
            border-radius: 50%; position: relative; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.6), inset 0 0 20px rgba(255,255,255,0.5);
            border: 8px solid #cca300; transition: transform 0.1s;
        }
        #main-tap-coin::before { content: "C"; font-size: 80px; font-weight: bold; color: #b38f00; }
        #main-tap-coin:active { transform: scale(0.92); }
        
        /* Floating Animation */
        .plus-one { 
            position: absolute; color: #ffffff; font-size: 35px; font-weight: bold; 
            pointer-events: none; animation: flyUp 0.8s ease-out forwards; z-index: 100;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        @keyframes flyUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-160px); } }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #000; padding: 15px 0; border-top: 1px solid #222; }
        .nav-item { flex: 1; font-size: 10px; color: #666; cursor: pointer; }
        .nav-item.active { color: #ffcc00; }

        /* Pages */
        .sub-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 1000; padding: 20px; box-sizing: border-box; }
        .back-home { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 8px; margin-top: 20px; cursor: pointer; }
        
        /* Upgrade Card Design */
        .upgrade-card { background: #1a1a1a; border: 1px solid #333; border-radius: 20px; padding: 25px; margin-top: 30px; }
        .price-tag { color: #ffcc00; font-size: 20px; font-weight: bold; margin: 15px 0; }
        .buy-btn { background: #00ffcc; color: #000; border: none; padding: 15px 30px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px; }
        .buy-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="home-page" style="width: 100%;">
        <div class="stats-container" style="margin: 0 auto;">
            <div class="stat-box">
                <div class="stat-label">Earn per tap</div>
                <div class="stat-val">+<span id="tap-power-val">1</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Energy</div>
                <div class="stat-val"><span id="energy-val">10</span>/10</div>
            </div>
        </div>

        <div class="upgrade-wrapper" style="margin: 0 auto;">
            <button class="main-up-btn" onclick="openPage('upgrade-tap-page')">🚀 Upgrade Tap</button>
            <button class="main-up-btn" onclick="openPage('upgrade-energy-page')" style="color: #ffcc00;">⚡ Upgrade Energy</button>
        </div>

        <div class="wallet-container">
            <div style="width:25px; height:25px; background:#ffcc00; border-radius:50%; border:2px solid #b38f00;"></div>
            <div class="wallet-info">
                <span class="wallet-label">YOUR EARNING</span>
                <span class="wallet-coins" id="total-coins">0</span>
                <span class="wallet-rs">≈ ₹<span id="total-rs">0.00</span></span>
            </div>
        </div>

        <div class="coin-wrapper">
            <div id="main-tap-coin"></div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="closeAllPages()">🏠<br>Home</div>
            <div class="nav-item" onclick="openPage('task-page')">⛏️<br>More Task</div>
            <div class="nav-item" onclick="openPage('friends-page')">👥<br>Friends</div>
            <div class="nav-item" onclick="openPage('withdraw-page')">💰<br>Withdraw</div>
        </div>
    </div>

    <div id="upgrade-tap-page" class="sub-page">
        <h2 style="color: #00ffcc;">Tap Upgrade Center</h2>
        <p style="color: #888;">Increase your earning power!</p>
        
        <div class="upgrade-card">
            <h3>🔥 Power Double</h3>
            <p>Get +2 coins every time you tap!</p>
            <div class="price-tag">Cost: 100 Coins</div>
            <button id="buy-upgrade-btn" class="buy-btn" onclick="buyTapUpgrade()">UPGRADE TO LVL 2</button>
        </div>

        <button class="back-home" onclick="closeAllPages()">← Back to Home</button>
    </div>

    <div id="upgrade-energy-page" class="sub-page"><h2>Energy Upgrade</h2><button class="back-home" onclick="closeAllPages()">Back</button></div>
    <div id="task-page" class="sub-page"><h2>Tasks</h2><button class="back-home" onclick="closeAllPages()">Back</button></div>
    <div id="friends-page" class="sub-page"><h2>Friends</h2><button class="back-home" onclick="closeAllPages()">Back</button></div>
    <div id="withdraw-page" class="sub-page"><h2>Withdraw</h2><button class="back-home" onclick="closeAllPages()">Back</button></div>

    <script>
        let tele = window.Telegram.WebApp;
        tele.expand();

        // Data Storage
        let score = parseInt(localStorage.getItem('tap_score')) || 0;
        let energy = parseInt(localStorage.getItem('tap_energy')) || 10;
        let tapPower = parseInt(localStorage.getItem('tap_power')) || 1; // Default is +1

        function updateUI() {
            document.getElementById('total-coins').innerText = score;
            document.getElementById('energy-val').innerText = energy;
            document.getElementById('tap-power-val').innerText = tapPower;
            document.getElementById('total-rs').innerText = (score / 100).toFixed(2);

            // Disable button if already upgraded or not enough coins
            let upBtn = document.getElementById('buy-upgrade-btn');
            if(tapPower >= 2) {
                upBtn.innerText = "MAX LEVEL REACHED";
                upBtn.disabled = true;
            }

            localStorage.setItem('tap_score', score);
            localStorage.setItem('tap_energy', energy);
            localStorage.setItem('tap_power', tapPower);
        }

        // Tap Logic
        document.getElementById('main-tap-coin').addEventListener('click', function(e) {
            if (energy > 0) {
                score += tapPower; // Use tapPower (+1 or +2)
                energy--;
                
                const p1 = document.createElement('div');
                p1.innerText = '+' + tapPower;
                p1.className = 'plus-one';
                p1.style.left = (e.clientX - 20) + 'px';
                p1.style.top = (e.clientY - 40) + 'px';
                document.body.appendChild(p1);
                setTimeout(() => p1.remove(), 800);
                
                updateUI();
            } else {
                tele.showAlert("Out of Energy!");
            }
        });

        // Upgrade Function
        function buyTapUpgrade() {
            if (score >= 100) {
                score -= 100;
                tapPower = 2; // Level 2
                tele.showScanQrPopup({text: "Upgrading..."}); // Just for effect
                setTimeout(() => {
                    tele.closeScanQrPopup();
                    tele.showAlert("Badhai ho! Ab aap Level 2 par hain. Har tap par +2 milega!");
                    updateUI();
                }, 1000);
            } else {
                tele.showAlert("Bhai, kam se kam 100 coins chahiye!");
            }
        }

        function openPage(id) {
            document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
            document.getElementById('home-page').style.display = 'none';
            document.getElementById(id).style.display = 'block';
        }

        function closeAllPages() {
            document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
            document.getElementById('home-page').style.display = 'block';
        }

        updateUI();
    </script>
</body>
</html>
