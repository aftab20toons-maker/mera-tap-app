<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Fast</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #121212; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; user-select: none; }
        .header { padding: 15px; font-size: 1.1rem; color: #00d2ff; font-weight: bold; }
        .score-box { font-size: 3rem; margin: 10px; color: #fff; text-shadow: 0 0 10px #00d2ff; }
        #main-coin { width: 220px; cursor: pointer; transition: transform 0.1s; filter: drop-shadow(0 0 15px #00d2ff); -webkit-tap-highlight-color: transparent; }
        #main-coin:active { transform: scale(0.9); }
        
        /* Floating +1 */
        .plus-one { position: absolute; color: #00ffcc; font-weight: bold; font-size: 1.5rem; animation: floatUp 0.6s ease-out forwards; pointer-events: none; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }

        /* Buttons */
        .btn { display: none; margin: 15px auto; padding: 15px 30px; border-radius: 12px; border: none; font-weight: bold; font-size: 1.1rem; cursor: pointer; width: 85%; transition: 0.3s; }
        #earn-more-btn { background: linear-gradient(45deg, #4caf50, #81c784); color: white; display: block; }
        #withdraw-btn { background: linear-gradient(45deg, #ff9800, #ffb74d); color: white; }
        
        /* Ad Timer Overlay */
        #ad-loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #00d2ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Withdraw Page */
        #withdraw-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 100; padding-top: 40px; }
        input { padding: 15px; width: 80%; border-radius: 10px; border: 1px solid #333; background: #222; color: white; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="ad-loader">
        <div class="spinner"></div>
        <p id="loader-text">Verifying Ad View...</p>
    </div>

    <div id="game-page">
        <div class="header">TAP FAST: <span id="user-name">Player</span></div>
        <div class="score-box"><span id="score">0</span></div>
        <div style="color:#888; margin-bottom: 20px;">Taps Left: <span id="taps-left">10</span>/10</div>

        <div id="coin-area">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968330.png" id="main-coin" alt="coin">
        </div>

        <button id="earn-more-btn" class="btn" onclick="startAdProcess()">Earn More (Ads) +10 💰</button>
        <button id="withdraw-btn" class="btn" onclick="openWithdraw()">Withdraw (Min 1 RS)</button>
    </div>

    <div id="withdraw-page">
        <h2>Withdraw Funds</h2>
        <p style="color: #4caf50;">Minimum Withdrawal: 1 RS</p>
        <input type="text" id="upi-id" placeholder="Enter UPI ID (e.g. user@apl)">
        <button class="btn" style="display:block; background:#4caf50;" onclick="alert('Withdrawal request submitted!')">Submit Request</button>
        <p onclick="closeWithdraw()" style="color:#aaa; cursor:pointer; margin-top:20px;">← Back to Tap Fast</p>
    </div>

    <script>
        let tele = window.Telegram.WebApp;
        tele.expand();
        document.getElementById('user-name').innerText = tele.initDataUnsafe.user?.first_name || "Player";

        let score = 0;
        let tapsLeft = 10;
        let adsToday = 0;

        const mainCoin = document.getElementById('main-coin');
        const scoreDisplay = document.getElementById('score');
        const tapsDisplay = document.getElementById('taps-left');

        mainCoin.addEventListener('click', (e) => {
            if (tapsLeft > 0) {
                score++;
                tapsLeft--;
                showPlusOne(e.clientX, e.clientY);
                updateUI();
            }
            if (tapsLeft === 0) {
                mainCoin.style.display = 'none';
                document.getElementById('withdraw-btn').style.display = 'block';
            }
        });

        function showPlusOne(x, y) {
            const el = document.createElement('div');
            el.innerText = "+1";
            el.className = 'plus-one';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        function startAdProcess() {
            if (adsToday >= 3) {
                alert("Hourly limit reached!");
                return;
            }

            // 1. Ad Open Karo (Replace with your Adsterra Direct Link)
            window.open('https://www.google.com', '_blank'); 

            // 2. Loader Dikhao
            const loader = document.getElementById('ad-loader');
            loader.style.display = 'flex';
            
            let timeLeft = 5;
            const timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('loader-text').innerText = `Verifying... ${timeLeft}s`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    loader.style.display = 'none';
                    score += 10;
                    adsToday++;
                    updateUI();
                    alert("Verification Complete! +10 Points added.");
                    document.getElementById('loader-text').innerText = `Verifying Ad View...`;
                }
            }, 1000);
        }

        function updateUI() {
            scoreDisplay.innerText = score;
            tapsDisplay.innerText = tapsLeft;
        }

        function openWithdraw() { document.getElementById('withdraw-page').style.display = 'block'; }
        function closeWithdraw() { document.getElementById('withdraw-page').style.display = 'none'; }
    </script>
</body>
</html>
