<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapsterra Hourly Loot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0b0b; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; user-select: none; display: flex; flex-direction: column; align-items: center; }
        .stats-container { display: flex; justify-content: space-between; width: 90%; padding: 15px 0; gap: 10px; }
        .stat-box { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 12px; flex: 1; }
        .stat-lvl { font-size: 10px; color: #00ffcc; font-weight: bold; display: block; margin-bottom: 4px; }
        .stat-val { font-size: 16px; font-weight: bold; color: #ffcc00; }
        
        .wallet-container { background: rgba(255,255,255,0.03); border: 1px dashed #444; border-radius: 50px; padding: 10px 25px; margin: 15px auto; display: inline-flex; align-items: center; }
        .wallet-coins { font-size: 26px; font-weight: bold; margin-left: 10px; }

        .sub-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .upgrade-card { background: #1a1a1a; border: 1px solid #333; border-radius: 15px; padding: 15px; margin-top: 15px; }
        .buy-btn { background: #00ffcc; color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        
        /* UPI Options */
        .upi-box { background: #222; border: 1px solid #444; padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
        .withdraw-options { display: none; margin-top: 20px; }

        #main-tap-coin { width: 180px; height: 180px; background: radial-gradient(circle, #ffe066 0%, #ffcc00 50%, #b38f00 100%); border-radius: 50%; border: 8px solid #cca300; margin: 20px auto; cursor: pointer; }
        #main-tap-coin:active { transform: scale(0.95); }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #000; padding: 15px 0; border-top: 1px solid #222; }
        .nav-item { flex: 1; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div id="home-page">
        <div class="stats-container">
            <div class="stat-box"><span class="stat-lvl">LVL <span id="home-tap-lvl">1</span></span><div class="stat-val">+<span id="tap-power-val">1</span></div></div>
            <div class="stat-box"><span class="stat-lvl">LVL <span id="home-energy-lvl">1</span></span><div class="stat-val"><span id="current-energy">10</span>/<span id="max-energy">10</span></div></div>
        </div>
        <div class="wallet-container">💰 <span class="wallet-coins" id="total-coins">0</span></div>
        <div id="main-tap-coin"></div>
        <button class="buy-btn" style="width: 80%;" onclick="openPage('upgrade-tap-page')">🚀 UPGRADE</button>
    </div>

    <div id="withdraw-page" class="sub-page">
        <h2 style="color:#00ffcc">Withdrawal</h2>
        
        <div id="upi-select-section">
            <p>Select Method:</p>
            <div class="upi-box" onclick="showWithdrawOptions()">
                <strong>📱 UPI Transfer</strong>
                <p style="font-size: 10px; color: #888;">Instant withdrawal to bank</p>
            </div>
        </div>

        <div id="withdraw-options" class="withdraw-options">
            <p>Choose Amount:</p>
            
            <div class="upgrade-card">
                <h3 id="dynamic-title">₹1 Minimum</h3>
                <p style="font-size: 12px;">Next withdraw goal: <span id="next-goal">₹1</span></p>
                <button class="buy-btn" id="dynamic-wd-btn" onclick="executeWithdraw('dynamic')">Redeem Now</button>
            </div>

            <div class="upgrade-card" style="border-color: #ffcc00;">
                <h3>₹10 Fixed</h3>
                <p style="font-size: 12px;">Available every time!</p>
                <button class="buy-btn" style="background: #ffcc00;" onclick="executeWithdraw('fixed')">Redeem Now</button>
            </div>
            
            <button class="buy-btn" style="background: #444; color: white;" onclick="resetWithdrawPage()">← Back to UPI</button>
        </div>

        <button class="buy-btn" style="background: #333; color: #888; margin-top: 30px;" onclick="closeAllPages()">Close</button>
    </div>

    <div id="upgrade-tap-page" class="sub-page"><h2>Upgrade</h2><button onclick="closeAllPages()">Back</button></div>

    <script>
        let tele = window.Telegram.WebApp;
        
        let score = parseInt(localStorage.getItem('tap_score')) || 0;
        let tapPower = parseInt(localStorage.getItem('tap_power')) || 1;
        let energyLvl = parseInt(localStorage.getItem('energy_lvl')) || 1;
        let withdrawCount = parseInt(localStorage.getItem('withdraw_count')) || 0; // Track how many times withdrawn
        
        let maxEnergy = energyLvl * 10;
        let currentEnergy = parseInt(localStorage.getItem('current_energy')) || maxEnergy;

        function updateUI() {
            document.getElementById('total-coins').innerText = score;
            document.getElementById('tap-power-val').innerText = tapPower;
            document.getElementById('home-tap-lvl').innerText = tapPower;
            document.getElementById('home-energy-lvl').innerText = energyLvl;
            document.getElementById('current-energy').innerText = currentEnergy;
            document.getElementById('max-energy').innerText = maxEnergy;

            // Update Dynamic Withdraw Box
            let currentMin = withdrawCount + 1; // 1st time 1, 2nd time 2...
            document.getElementById('dynamic-title').innerText = `₹${currentMin} Minimum`;
            document.getElementById('next-goal').innerText = `₹${currentMin}`;
            
            localStorage.setItem('tap_score', score);
            localStorage.setItem('withdraw_count', withdrawCount);
        }

        // Withdraw Logic
        function showWithdrawOptions() {
            document.getElementById('upi-select-section').style.display = 'none';
            document.getElementById('withdraw-options').style.display = 'block';
        }

        function resetWithdrawPage() {
            document.getElementById('upi-select-section').style.display = 'block';
            document.getElementById('withdraw-options').style.display = 'none';
        }

        function executeWithdraw(type) {
            let amount;
            if (type === 'dynamic') {
                amount = withdrawCount + 1; // Current Level (1, 2, 3...)
            } else {
                amount = 10; // Fixed 10 Rs
            }

            let coinCost = amount * 100; // 1 Rs = 100 coins

            if (score >= coinCost) {
                score -= coinCost;
                if (type === 'dynamic') {
                    withdrawCount++; // Increment level only for dynamic box
                }
                updateUI();
                tele.showAlert(`Withdraw success: ₹${amount}!`);
            } else {
                tele.showAlert(`Kam se kam ${coinCost} coins chahiye!`);
            }
        }

        // Tap Logic
        document.getElementById('main-tap-coin').addEventListener('click', () => {
            if(currentEnergy > 0) { score += tapPower; currentEnergy--; updateUI(); }
        });

        setInterval(() => { if(currentEnergy < maxEnergy) { currentEnergy++; updateUI(); } }, 1000);

        function openPage(id) { document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none'); document.getElementById(id).style.display = 'block'; }
        function closeAllPages() { document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none'); document.getElementById('home-page').style.display = 'block'; resetWithdrawPage(); }

        updateUI();
    </script>
</body>
</html>
