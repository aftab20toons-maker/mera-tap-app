<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Tap - Battle Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0b0b; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; user-select: none; }
        
        /* Top Stats Bar */
        .stats-container { display: flex; justify-content: space-between; padding: 15px; gap: 10px; }
        .stat-box { background: rgba(255, 255, 255, 0.05); border: 1px solid #333; border-radius: 12px; padding: 10px; flex: 1; }
        .stat-label { font-size: 10px; color: #00ffcc; text-transform: uppercase; margin-bottom: 5px; }
        .stat-val { font-size: 16px; font-weight: bold; }
        .up-btn { font-size: 9px; background: #00ffcc; color: black; border-radius: 4px; padding: 2px 5px; border: none; margin-top: 5px; cursor: pointer; }

        /* Main Score */
        .main-score { font-size: 3rem; font-weight: bold; margin: 20px 0; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        .main-score img { width: 30px; vertical-align: middle; margin-right: 10px; }

        /* Coin Area */
        .coin-wrapper { position: relative; margin-top: 30px; display: inline-block; }
        #main-coin { width: 220px; height: 220px; border-radius: 50%; cursor: pointer; transition: transform 0.1s; }
        #main-coin:active { transform: scale(0.92); }
        
        /* Floating Animation */
        .plus-one { position: absolute; color: #ffcc00; font-size: 28px; font-weight: bold; pointer-events: none; animation: flyUp 0.8s ease-out forwards; }
        @keyframes flyUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }

        /* Navigation Pages */
        #upgrade-page, #energy-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; padding-top: 50px; z-index: 1000; }
        .back-btn { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="game-page">
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-label">Earn per tap</div>
                <div class="stat-val">+<span id="per-tap">1</span></div>
                <button class="up-btn" onclick="openPage('upgrade-page')">UPGRADE</button>
            </div>
            <div class="stat-box">
                <div class="stat-label">Energy</div>
                <div class="stat-val"><span id="energy-val">10</span>/10</div>
                <button class="up-btn" onclick="openPage('energy-page')" style="background: #ffcc00;">UPGRADE</button>
            </div>
        </div>

        <div class="main-score">
            <img src="https://cdn-icons-png.flaticon.com/512/2489/2489756.png" alt="coin">
            <span id="total-score">0</span>
        </div>

        <div class="coin-wrapper" id="coin-area">
            <img src="https://cdn-icons-png.flaticon.com/512/2489/2489756.png" id="main-coin">
        </div>
    </div>

    <div id="upgrade-page">
        <h2>Upgrade Tap Power</h2>
        <p style="color: #888;">Nayi updates yahan aayengi...</p>
        <button class="back-btn" onclick="closePages()">← Back</button>
    </div>

    <div id="energy-page">
        <h2>Upgrade Energy Limit</h2>
        <p style="color: #888;">Nayi updates yahan aayengi...</p>
        <button class="back-btn" onclick="closePages()">← Back</button>
    </div>

    <script>
        let tele = window.Telegram.WebApp;
        tele.expand();

        let score = parseInt(localStorage.getItem('tap_score')) || 0;
        let energy = parseInt(localStorage.getItem('tap_energy')) || 10;
        let lastRefill = localStorage.getItem('last_refill') || Date.now();

        // 1 Hr Refill Logic (10 Energy per hour)
        setInterval(() => {
            let now = Date.now();
            if (now - lastRefill > 3600000 && energy < 10) { // 3600000ms = 1hr
                energy = 10;
                lastRefill = now;
                localStorage.setItem('last_refill', lastRefill);
                updateUI();
            }
        }, 10000);

        function updateUI() {
            document.getElementById('total-score').innerText = score;
            document.getElementById('energy-val').innerText = energy;
            localStorage.setItem('tap_score', score);
            localStorage.setItem('tap_energy', energy);
        }

        document.getElementById('main-coin').addEventListener('click', (e) => {
            if (energy > 0) {
                score++;
                energy--;
                
                // Animation
                const p1 = document.createElement('div');
                p1.innerText = '+1'; p1.className = 'plus-one';
                p1.style.left = (e.clientX - 20) + 'px';
                p1.style.top = (e.clientY - 40) + 'px';
                document.body.appendChild(p1);
                setTimeout(() => p1.remove(), 800);
                
                updateUI();
            } else {
                alert("Out of Energy! Wait for 1 hour.");
            }
        });

        function openPage(id) {
            document.getElementById(id).style.display = 'block';
        }

        function closePages() {
            document.getElementById('upgrade-page').style.display = 'none';
            document.getElementById('energy-page').style.display = 'none';
        }

        updateUI();
    </script>
</body>
</html>
